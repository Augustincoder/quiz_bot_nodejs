<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{TITLE}}</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0e1621;
      --card-bg: #17212b;
      --accent: #2481cc;
      --success: #4caf50;
      --warning: #ff9800;
      --danger: #f44336;
      --text: #f5f5f5;
      --text-muted: #8e9ca8;
      --border-color: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at 50% 0%, #1c2734 0%, var(--bg-color) 85%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .header {
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      text-align: center;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Top stats */
    .summary-strip {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 16px;
    }
    .badge-error {
      background: rgba(244, 67, 54, 0.15);
      color: #ef5350;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 600;
    }

    /* Question Inspector Card */
    .inspector-arena {
      perspective: 1000px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 16px;
    }
    .card-wrap {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      transform-style: preserve-3d;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .q-number-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .q-idx {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }
    .q-error-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 152, 0, 0.15);
      color: #ffb74d;
    }

    .q-stem {
      font-size: 15px;
      line-height: 1.5;
      font-weight: 500;
      color: #fff;
      margin-bottom: 14px;
      max-height: 140px;
      overflow-y: auto;
    }

    /* Options picker */
    .options-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .opt-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-item:active { transform: scale(0.98); }
    .opt-item.selected {
      background: rgba(76, 175, 80, 0.18);
      border-color: var(--success);
    }
    .opt-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }
    .opt-item.selected .opt-badge {
      background: var(--success);
      color: #fff;
    }
    .opt-text {
      font-size: 13px;
      color: #e0e0e0;
      line-height: 1.4;
      flex: 1;
    }

    /* Navigation row */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .nav-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }

    /* Action bar */
    .action-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-auto-heal {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #7b1fa2, #512da8);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(123, 31, 162, 0.35);
      transition: opacity 0.2s;
    }
    .btn-auto-heal:active { opacity: 0.85; }
    .btn-save {
      width: 100%;
      padding: 12px;
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-save:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔧 {{TITLE}}</h1>
    <p>Smart Docx Healer & Xatoliklar Inspektori</p>
  </div>

  <div class="summary-strip">
    <span id="file-name">Fayl: test.docx</span>
    <span class="badge-error" id="error-badge">3 ta xatolik</span>
  </div>

  <div class="inspector-arena" id="inspector-arena">
    <div class="card-wrap" id="card-wrap">
      <div class="q-number-row">
        <span class="q-idx" id="q-idx">Savol #1</span>
        <span class="q-error-tag" id="q-error">To'g'ri javob belgilanmagan</span>
      </div>

      <div class="q-stem" id="q-stem">Savol matni yuklanmoqda...</div>

      <div class="options-title">Variantni tanlang (To'g'ri javob kaliti):</div>
      <div class="options-list" id="options-list">
        <!-- Rendered dynamically -->
      </div>

      <div class="nav-row">
        <button class="nav-btn" id="btn-prev" onclick="changeQuestion(-1)">◀ Oldingisi</button>
        <span style="font-size: 12px; color: var(--text-muted);" id="q-counter">1 / 1</span>
        <button class="nav-btn" id="btn-next" onclick="changeQuestion(1)">Keyingisi ▶</button>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn-auto-heal" id="btn-auto-heal" onclick="autoHealAll()">
      <span>✨</span>
      <span>AI Barchasini Avto-Tuzatish</span>
    </button>
    <button class="btn-save" onclick="saveAndComplete()">
      💾 Saqlash va Yakunlash
    </button>
  </div>

  <script>
    window.__WIDGET_DATA__ = {{DATA_JSON}};

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const data = window.__WIDGET_DATA__ || {};
    let questions = (data.questions && data.questions.length > 0) ? [...data.questions] : [
      {
        id: 1,
        questionText: 'Korporativ boshqaruvning asosiy maqsadi nima?',
        error: 'To\'g\'ri javob kaliti yo\'q',
        options: [
          { text: 'Aksiyadorlar boyligini maksimallashtirish', isCorrect: false },
          { text: 'Faqat soliqlarni kamaytirish', isCorrect: false },
          { text: 'Xodimlarni qisqartirish', isCorrect: false },
          { text: 'Bozor narxini sun\'iy oshirish', isCorrect: false }
        ]
      }
    ];

    let currentIndex = 0;
    const cardWrap = document.getElementById('card-wrap');

    function renderQuestion() {
      const q = questions[currentIndex];
      if (!q) return;

      document.getElementById('q-idx').textContent = `Savol #${q.id || (currentIndex + 1)}`;
      document.getElementById('q-error').textContent = q.error || 'Tekshiruv talab etiladi';
      document.getElementById('q-stem').textContent = q.questionText || q.raw || 'Savol matni';
      document.getElementById('q-counter').textContent = `${currentIndex + 1} / ${questions.length}`;

      document.getElementById('btn-prev').disabled = (currentIndex === 0);
      document.getElementById('btn-next').disabled = (currentIndex === questions.length - 1);

      const optsList = document.getElementById('options-list');
      optsList.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D', 'E'];
      const opts = q.options || [];

      opts.forEach((opt, idx) => {
        const item = document.createElement('div');
        item.className = 'opt-item' + (opt.isCorrect ? ' selected' : '');
        item.onclick = () => selectOptionKey(idx);

        const badge = document.createElement('div');
        badge.className = 'opt-badge';
        badge.textContent = letters[idx] || (idx + 1);

        const txt = document.createElement('div');
        txt.className = 'opt-text';
        txt.textContent = typeof opt === 'string' ? opt : (opt.cleanText || opt.text || opt.raw);

        item.appendChild(badge);
        item.appendChild(txt);
        optsList.appendChild(item);
      });
    }

    function selectOptionKey(optIdx) {
      const q = questions[currentIndex];
      if (!q || !q.options) return;
      q.options.forEach((opt, idx) => {
        opt.isCorrect = (idx === optIdx);
      });
      q.error = '✅ Kalit belgilandi';
      renderQuestion();
      sendWidgetQuery('fix_option', { questionIdx: currentIndex, correctOptionIdx: optIdx });
    }

    function changeQuestion(delta) {
      const nextIdx = currentIndex + delta;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        currentIndex = nextIdx;
        renderQuestion();
      }
    }

    function autoHealAll() {
      const btn = document.getElementById('btn-auto-heal');
      btn.textContent = '⏳ AI tahlil qilmoqda...';
      btn.disabled = true;

      sendWidgetQuery('auto_heal_all', { questionsCount: questions.length }, (res) => {
        btn.textContent = '✨ AI Barchasini Avto-Tuzatish';
        btn.disabled = false;
        if (res && res.data && res.data.healed) {
          questions = res.data.healed;
          renderQuestion();
        } else {
          // Default heuristic fix for preview
          questions.forEach(q => {
            if (q.options && q.options.length > 0 && !q.options.some(o => o.isCorrect)) {
              q.options[0].isCorrect = true;
              q.error = '✅ AI orqali tiklandi';
            }
          });
          renderQuestion();
        }
      });
    }

    function saveAndComplete() {
      sendWidgetQuery('save_docx', { questions }, () => {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.close();
        } else {
          window.parent.postMessage({ action: 'docx_healed', questions }, '*');
        }
      });
    }

    function sendWidgetQuery(action, actionData, cb) {
      const token = '{{TOKEN}}' || data.token;
      fetch('/widget/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, action, data: actionData })
      })
      .then(r => r.json())
      .then(res => { if (cb) cb(res); })
      .catch(err => { if (cb) cb(null); });
    }

    // Touch / Swipe gestures for question navigation
    let touchStartX = 0;
    const arena = document.getElementById('inspector-arena');
    arena.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    arena.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      if (diffX < -50) {
        changeQuestion(1);
      } else if (diffX > 50) {
        changeQuestion(-1);
      }
    }, { passive: true });

    renderQuestion();
  </script>
</body>
</html>
